<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Réinitialisation du mot de passe</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:400,400i,500,500i,700,700i');
        body{
            font-family: 'Montserrat', sans-serif;
        }
    </style>
</head>

<body style="background-color:#f8f8f8;">
    <!-- welcome email -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%"
        style="background-color: #f8f8f8;height:100%;padding:24px">
        <tr>
            <td align="center" valign="top" style="background-color: #f8f8f8;">
                <center>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                        <tr>
                            <td align="center" valign="top" style="background-color: #f8f8f8; display: block;">
                                <img src="https://www.helloworld-agency.com/images/config/logo_hello_world.png"
                                    alt="Logo" style="display: block;height:80px;padding:16px">
                            </td>
                        </tr>
                    </table>
                </center>
            </td>
        </tr>
        <tr>
            <td align="center" valign="top" style="background-color: #f8f8f8;">
                <center>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding: 36px 24px 0; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; border-top: 3px solid #d4dadf;">
                                <h1
                                    style="margin: 0; font-size: 32px; font-weight: 700; letter-spacing: -1px; line-height: 48px;">
                                    Code de <span style="color: #14b6d3;">Réinitialisation</span></h1>
                            </td>
                        </tr>
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding-left: 24px;padding-right: 24px; font-family: 
                            'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                                <p style="margin: 0;">Bonjour {{ name }},</p><br>
                            </td>
                        </tr>
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding-left:24px;padding-right: 24px; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                                <p style=" margin: 0;">Il y a eu une demande de changement de mot de passe !</p>
                            </td>
                        </tr>
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding-left: 24px;padding-right: 24px; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                                <p style="margin: 0;">Si vous n'avez pas fait cette demande, veuillez ignorer cet
                                    e-mail.</p>
                            </td>
                        </tr>
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding-left: 24px;padding-right: 24px; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                                <p style="margin: 0;">Sinon, Votre 8 chiffres de code de réinitialisation est :</p>
                            </td>
                        </tr>
                        <tr bgcolor="#fff">
                            <!-- Login button red color-->

                            <td align="center"
                                style="border-radius: 6px; font-size: large;font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-weight: 600; padding: 12px 24px; color: #14b6d3; border-color: #14b6d3;">
                                <h3>{{ code }}</h3>
                            </td>

                        </tr>

                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding-left: 24px;padding-right: 24px; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px;">
                                <p style="margin: 0;">Cordialement,</p>
                                <p style="margin: 0;">L'equipe de

                                    <a href="https://helloworld-agency.com"
                                        style="color: #14b6d3; text-decoration: none;">Hello World Agency</a>
                                </p>
                            </td>
                        </tr>
                </center>
            </td>
        </tr>
        <tr>
            <td align="center" valign="top" style="background-color: #f8f8f8;">
                <center>
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 600px;">
                        <tr>
                            <td align="left" bgcolor="#ffffff"
                                style="padding: 24px; font-family: 'Montserrat','Source Sans Pro', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 24px; border-bottom: 3px solid #d4dadf;">

                            </td>
                        </tr>
                    </table>
                </center>
            </td>
        </tr>
    </table>
</body>

</html>
